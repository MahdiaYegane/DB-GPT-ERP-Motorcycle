[system]
language = "${env:DBGPT_LANG:-en}"
api_keys = []
encrypt_key = "your_secret_key"

# Server Configurations
[service.web]
host = "0.0.0.0"
port = 5670
cors_allowed_origins = "*"

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"

[service.web.agent_context]
# Groq qwen3-32b: ~131K context window. TPM (tokens/minute) is a RATE limit,
# not the context window — do NOT shrink max_context_tokens to satisfy TPM;
# that only forces the UI to 100% and triggers destructive compaction that
# wipes tool results every round (which causes tool-call retry loops).
# TPM overruns surface as HTTP 429 and are absorbed by the agent's LLM retry.
max_context_tokens = 20000
reserved_tokens = 2048
warning_threshold = 0.70
error_threshold = 0.90
critical_threshold = 0.95
min_keep_recent_rounds = 2
max_observation_age_rounds = 5
truncated_observation_max_chars = 500
min_keep_tokens = 6000
max_compact_failures = 3
max_parallel_subagents = 1

[app]
# Output cap must leave room for full tool-call argument JSON. Too small a
# value truncates tool arguments mid-JSON -> empty args -> "No code provided"
# retry loops. 1500 fits a typical matplotlib script + thought.
temperature = 0.2
max_new_tokens = 1500

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

# Model Configurations - Groq + local fallback (Groq hit 200K/day limit, local avoids 429)
[models]
[[models.llms]]
name = "qwen3.5:9b"
provider = "proxy/ollama"
api_base = "http://localhost:11434"
api_key = ""

[[models.llms]]
name = "openai/gpt-oss-120b"
provider = "proxy/openai"
api_key = "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"
api_base = "https://api.groq.com/openai/v1"

[[models.llms]]
name = "qwen/qwen3.8-27b"
provider = "proxy/openai"
api_key = "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"
api_base = "https://api.groq.com/openai/v1"

[[models.llms]]
name = "deepseek-v4.1-flash:free"
provider = "proxy/openai"
# TokenHarbor gateway (OpenAI-compatible). Key is read from the
# TOKENHARBOR_API_KEY environment variable so the secret never lands in git.
# All four entries below are free-tier ids (no charge); paid ids drop ":free".
# Paid: "deepseek-v4.1-flash" (1M ctx, $0.30/1M in).
api_key = "${env:TOKENHARBOR_API_KEY}"
api_base = "https://tokenharbor.ai/v1"

[[models.llms]]
name = "qwen3.8-flash:free"
provider = "proxy/openai"
# Paid: "qwen3.8-flash" ($0.15/1M in, 128K max output; text+image+video).
api_key = "${env:TOKENHARBOR_API_KEY}"
api_base = "https://tokenharbor.ai/v1"

[[models.llms]]
name = "deepseek-v4-flash:free"
provider = "proxy/openai"
# Paid: "deepseek-v4-flash" (1M ctx, $0.44/1M in, text-only).
api_key = "${env:TOKENHARBOR_API_KEY}"
api_base = "https://tokenharbor.ai/v1"

[[models.llms]]
name = "mimo-v2.5:free"
provider = "proxy/openai"
# Paid: "mimo-v2.5" (1M ctx, $0.14/1M in; text+image+audio+video).
api_key = "${env:TOKENHARBOR_API_KEY}"
api_base = "https://tokenharbor.ai/v1"

[[models.embeddings]]
name = "bge-m3:567m"
provider = "proxy/ollama"
api_url = "http://localhost:11434"
api_key = ""

