[system]
# Load language from environment variable(It is set by the hook)
language = "${env:DBGPT_LANG:-en}"
api_keys = []
encrypt_key = "${env:DBGPT_ENCRYPT_KEY:-your_secret_key}"

# Server Configurations
[service.web]
host = "0.0.0.0"
port = 5670
# CORS allowed origins: '*' allows all; set comma-separated origins to restrict.
cors_allowed_origins = "${env:DBGPT_CORS_ALLOWED_ORIGINS:-*}"

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"

[service.web.agent_context]
# Same budget as dbgpt-proxy-qwen-gateway.toml. Per-model clamp in
# agentic_data_api._load_context_budget_config caps this to each model's
# real context_length, so small models fail safe instead of overflowing.
max_context_tokens = 999000
reserved_tokens = 2048
warning_threshold = 0.70
error_threshold = 0.90
critical_threshold = 0.95
min_keep_recent_rounds = 2
max_observation_age_rounds = 5
truncated_observation_max_chars = 500
min_keep_tokens = 6000
max_compact_failures = 3
max_parallel_subagents = 1

[app]
# Output cap must leave room for full tool-call argument JSON. Too small a
# value truncates tool arguments mid-JSON -> empty args -> "No code provided"
# retry loops. temperature = 0 for deterministic, stable answers.
temperature = 0
max_new_tokens = 1500
[service.model.worker]
host = "127.0.0.1"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

# ============================================================================
# Liara AI (Iran) — OpenAI-compatible proxy provider: proxy/liara
# Tested 2026-09-28 on service `dbgpt` (workspace 6aba44bb5d4e25a451926448).
# - Base URL:  https://ai.liara.ir/api/{workspace_id}/v1
# - Auth:      Authorization: Bearer $LIARA_API_KEY (no x-teamid header needed)
# - NEVER put TeamID (6aba3e24...) in the URL path -> 403 access denied.
# Docs: https://docs.liara.ir/ai/quick-start/
# Jev is exposed separately as the TypeSafe decision tool, not as a chat model:
# Liara model ID: typesafe/jev-1.13; endpoint: /api/{workspace_id}/v1/decisions.
# It uses LIARA_API_KEY and LIARA_API_BASE just like the Liara chat models below.
# Automatic input triage runs per user turn (advisory only, fail-open):
#   LIARA_JEV_AUTO_ENABLE=1 (default; set 0/false/no to disable)
#   LIARA_JEV_AUTO_TIMEOUT=8.0 (seconds, fail-open on timeout)
#   LIARA_JEV_TRIAGE_MAX_CHARS=2000 (triage state budget; verification keeps more)
#   LIARA_JEV_REPORT_THRESHOLD=0.6 (noul threshold for report detection; tune it)
#   LIARA_JEV_VERIFY_ENABLE=1 / LIARA_JEV_VERIFY_TIMEOUT=4.0 (post-loop check)
#   LIARA_JEV_FALLBACK_REPORT=1 (synthesize fallback HTML when missing)
#   LIARA_JEV_MID_REMINDER_EVERY=5 (mid-loop guard cadence, adaptive on confidence)
#   LIARA_JEV_MAX_STATE_CHARS=6000 (max input chars sent to Jev)
#
# Setup:
#   1. $env:LIARA_API_KEY="<your-liara-ai-key>"   # PowerShell
#      export LIARA_API_KEY="<your-liara-ai-key>" # Linux/macOS
#   2. (optional) override workspace:
#      $env:LIARA_API_BASE="https://ai.liara.ir/api/<your-workspace-id>/v1"
#   3. Run: python launch_dbgpt.py start webserver --config configs/dbgpt-proxy-liara.toml
# ============================================================================
[models]
# --- Liara: Xiaomi MiMo-V2.5 (default, multimodal in, 1.05M context) ---
[[models.llms]]
name = "xiaomi/mimo-v2.5 (liara)"
provider = "proxy/liara"
backend = "xiaomi/mimo-v2.5"
# Real context window (without it the proxy default 4096 is used and
# conversation memory gets compacted away).
context_length = 1050000
api_base = "${env:LIARA_API_BASE:-https://ai.liara.ir/api/6aba44bb5d4e25a451926448/v1}"
api_key = "${env:LIARA_API_KEY}"

# --- Liara: Xiaomi MiMo-V2.5-Pro (text-to-text, 1.05M context) ---
