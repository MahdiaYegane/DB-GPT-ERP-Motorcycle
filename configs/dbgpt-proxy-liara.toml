# ============================================================================
# Embeddings — Liara OpenAI-compatible embeddings API (no local Ollama).
# Tested 2026-10-17: POST {LIARA_API_BASE}/embeddings with a fully-qualified
# model id (e.g. "openai/text-embedding-3-small", 1536 dims) and batched
# `input` arrays are supported. Batching removes one HTTP round-trip per
# chunk that the removed local Ollama runtime had.
# On provider change the DB-catalog embeddings rebuild automatically
# (model fingerprint check in dbgpt_serve.datasource.service.db_catalog).
# ============================================================================
[[models.embeddings]]
name = "text-embedding-3-small"
backend = "openai/text-embedding-3-small"
provider = "proxy/openai"
api_url = "${env:LIARA_API_BASE:-https://ai.liara.ir/api/6aba44bb5d4e25a451926448/v1}/embeddings"
api_key = "${env:LIARA_API_KEY}"
